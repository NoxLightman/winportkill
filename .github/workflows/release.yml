name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Build Rust CLI
        run: cargo build --release -p winportkill

      - name: Build Rust GUI
        run: cargo build --release -p winportkill-gui

      - name: Pack npm CLI
        working-directory: packages/npm-cli
        run: npm pack

      - name: Publish npm package
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/npm-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Upload Rust CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: winportkill-windows-x64-cli
          path: target/release/winportkill.exe

      - name: Upload Rust GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: winportkill-windows-x64-gui
          path: target/release/winportkill-gui.exe

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: winportkill-npm-package
          path: packages/npm-cli/*.tgz
