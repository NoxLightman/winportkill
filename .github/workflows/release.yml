name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Rust CLI
        run: cargo build --release -p winportkill

      - name: Build Rust GUI
        run: cargo build --release -p winportkill-gui

      - name: Pack npm CLI
        working-directory: packages/npm-cli
        run: npm pack

      - name: Install VS Code extension dependencies
        working-directory: .vscode-extension
        run: npm ci

      - name: Build VS Code extension
        working-directory: .vscode-extension
        run: npm run build

      - name: Package VS Code extension
        working-directory: .vscode-extension
        run: npm run package

      - name: Build JetBrains plugin
        working-directory: jetbrains-plugin
        run: .\gradlew.bat buildPlugin

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item target/release/winportkill.exe release-assets/winportkill-windows-x64.exe
          Copy-Item target/release/winportkill-gui.exe release-assets/winportkill-gui-windows-x64.exe
          Copy-Item packages/npm-cli/*.tgz release-assets/
          Copy-Item .vscode-extension/*.vsix release-assets/
          Copy-Item jetbrains-plugin/build/distributions/*.zip release-assets/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/winportkill-windows-x64.exe
            release-assets/winportkill-gui-windows-x64.exe
            release-assets/*.tgz
            release-assets/*.vsix
            release-assets/*.zip

      - name: Publish VS Code extension
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm exec vsce -- publish

      - name: Publish npm package
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/npm-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Upload Rust CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: winportkill-windows-x64-cli
          path: target/release/winportkill.exe

      - name: Upload Rust GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: winportkill-windows-x64-gui
          path: target/release/winportkill-gui.exe

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: winportkill-npm-package
          path: packages/npm-cli/*.tgz

      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: winportkill-vscode-extension
          path: .vscode-extension/*.vsix

      - name: Upload JetBrains plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: winportkill-jetbrains-plugin
          path: jetbrains-plugin/build/distributions/*.zip
